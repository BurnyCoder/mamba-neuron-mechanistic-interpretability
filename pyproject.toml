# Project metadata + dependencies, managed by uv (https://docs.astral.sh/uv/concepts/projects/config/).
# Global context: one installable package `mamba_neurons` (src layout) holds every pipeline phase;
# `uv run python -m mamba_neurons.pipeline` is the single entry point (see README.md).
[project]
name = "mamba-neurons"
version = "0.1.0"
description = "Neuron-level mechanistic interpretability and single-neuron steering of the Mamba-1.4B state-space language model"
readme = "README.md"
authors = [{ name = "Libor Burian (BurnyCoder)" }]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.21.0",
]

[project.scripts]
# Console entry point -> same wrapper as `python -m mamba_neurons.pipeline`.
mamba-neurons = "mamba_neurons.pipeline:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# PyTorch CUDA 13.0 wheels (support Blackwell sm_120 GPUs such as the RTX 5070), pinned to the
# PyTorch index exactly as in the uv PyTorch guide: https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
# Tests live in tests/ and import the installed package (https://docs.pytest.org/en/stable/reference/customize.html).
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
